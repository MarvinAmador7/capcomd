<style>
body{margin:0;background:#0c0c0d}
a{color:#4ea1ff;text-decoration:none}a:hover{color:#7cb9ff}
.st-wf{border-radius:12px;box-shadow:0 0 0 .5px rgba(255,255,255,.16),0 24px 60px rgba(0,0,0,.55)}
.st-search{display:flex;align-items:center;gap:6px;height:28px;flex:0 0 28px;margin:0 0 10px;padding:0 6px 0 8px;border-radius:7px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);font-size:13px;line-height:18px;color:var(--t3);white-space:nowrap}
.st-search .st-q{flex:1;min-width:0;color:var(--t1)}
.st-search .st-q i{display:inline-block;width:1px;height:15px;margin-left:1px;vertical-align:-3px;background:#0a84ff}
.st-search.on{box-shadow:inset 0 0 0 .5px rgba(10,132,255,.85),0 0 0 3px rgba(10,132,255,.22)}
.st-clr{width:16px;height:16px;border-radius:8px;background:rgba(255,255,255,.28);color:#161618;display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px}
.st-who{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;height:44px;flex:0 0 44px;padding:0 8px;border-radius:7px;cursor:pointer}
.st-who.sel{background:rgba(255,255,255,.08)}
.st-mk{width:28px;height:28px;flex:0 0 28px;border-radius:14px;background:#2c2c31;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.st-wt{display:flex;flex-direction:column;min-width:0}
.st-wn{font-size:13px;line-height:17px;font-weight:500;color:var(--t1)}
.st-ws{font-size:11.5px;line-height:15px;color:var(--t3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.st-gap{height:10px;flex:0 0 10px}
.st-ic{width:22px;height:22px;flex:0 0 22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 .5px 0 rgba(255,255,255,.42),inset 0 -.5px 0 rgba(0,0,0,.18),inset 0 0 0 .5px rgba(0,0,0,.22),0 1px 1.5px rgba(0,0,0,.4)}.st-ic svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.st-cb{min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#ffb020;color:#1d1d1f;font-size:10px;line-height:15px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;flex:0 0 auto;box-sizing:border-box}
.st-res{font-size:11.5px;line-height:16px;color:var(--t3);flex:0 0 auto}
.st-sb .row .tt b{font-weight:600;color:var(--t1)}
.st-sb .row{color:var(--t1)}
.st-tb{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:12px;padding:0 12px;white-space:nowrap}
.st-nav{display:inline-flex;height:28px;border-radius:14px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1);flex:0 0 auto}
.st-nav button{all:unset;box-sizing:border-box;width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--t1);cursor:pointer}
.st-nav button[disabled]{color:var(--t4)}
.st-nav button+button{box-shadow:inset .5px 0 0 rgba(255,255,255,.1)}
.st-tt{font-size:15px;line-height:20px;font-weight:600;color:var(--t1)}
.st-bd{flex:1;min-height:0;overflow:hidden;padding:6px 20px 24px;display:flex;flex-direction:column;gap:20px}
.st-bd.fade{-webkit-mask-image:linear-gradient(#000 90%,transparent);mask-image:linear-gradient(#000 90%,transparent)}
.st-sec{display:flex;flex-direction:column;gap:6px}
.st-gh{display:flex;align-items:center;gap:6px;padding:0 2px;font-size:13px;line-height:18px;font-weight:600;color:var(--t1)}
.st-card{border-radius:10px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.09);display:flex;flex-direction:column}
.st-card.hit{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.09),0 0 0 2px rgba(10,132,255,.9),0 0 0 6px rgba(10,132,255,.2)}
.st-r{position:relative;display:flex;align-items:center;gap:12px;min-height:40px;padding:7px 12px;font-size:13px;line-height:18px;color:var(--t1);white-space:nowrap}
.st-r+.st-r::before{content:"";position:absolute;left:12px;right:12px;top:0;height:.5px;background:rgba(255,255,255,.08)}
.st-r.k{min-height:32px;padding:5px 12px}
.st-r.off{opacity:.45}
.st-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.st-l small{font-size:11px;line-height:14px;color:var(--t3);overflow:hidden;text-overflow:ellipsis}
.st-ln{display:flex;align-items:center;gap:6px}
.st-gl{width:16px;flex:0 0 16px;display:inline-flex;justify-content:center;color:var(--t2)}
.st-v{display:inline-flex;align-items:center;gap:6px;color:var(--t3);white-space:nowrap}
.st-k{color:var(--t3);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.st-age{font-family:"SF Mono",ui-monospace,"JetBrains Mono",monospace;font-size:11px;color:var(--t3)}
.st-dot{width:8px;height:8px;flex:0 0 8px;border-radius:4px;display:inline-block}
.st-dot.d-ok{background:#30d158}.st-dot.d-warn{background:#ff9f0a}.st-dot.d-bad{background:#ff453a}
.st-dot.d-empty{box-shadow:inset 0 0 0 1.2px #8e8e93}
.st-dot.s6{width:6px;height:6px;flex-basis:6px;border-radius:3px}
.st-sw{display:inline-block;width:38px;height:22px;flex:0 0 38px;border-radius:11px;background:rgba(255,255,255,.18);position:relative}
.st-sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.st-sw.on{background:#0a84ff}
.st-sw.on::after{left:18px}
.st-pop,.st-btn{all:unset;box-sizing:border-box;height:22px;border-radius:6px;background:rgba(255,255,255,.13);box-shadow:inset 0 .5px 0 rgba(255,255,255,.08);display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--t1);white-space:nowrap;cursor:pointer;flex:0 0 auto}
.st-pop{padding:0 3px 0 8px}
.st-pop .st-ud{color:var(--t2);display:inline-flex}
.st-btn{padding:0 10px}
.st-btn.pri{background:#0a84ff;color:#fff;box-shadow:none}
.st-btn.sm{height:19px;padding:0 8px;border-radius:5px;font-size:11px}
.st-btn[disabled]{opacity:.4}
.st-seg{display:inline-flex;height:22px;padding:1px;border-radius:6px;background:rgba(255,255,255,.1);flex:0 0 auto}
.st-seg span{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 10px;border-radius:5px;font-size:12px;line-height:16px;color:var(--t2);white-space:nowrap}
.st-seg span.on{background:rgba(255,255,255,.26);color:#fff;box-shadow:0 .5px 1px rgba(0,0,0,.3)}
.st-cv{color:var(--t4);display:inline-flex;flex:0 0 auto}
.st-fn{display:flex;align-items:flex-start;gap:6px;padding:0 2px;font-size:11px;line-height:15px;color:var(--t3)}
.st-fn svg{flex:0 0 auto;margin-top:1px}
.st-fn .mono{font-size:10.5px;color:var(--t2)}
.st-def{font-size:11px;line-height:14px;font-weight:500;color:#4ea1ff;background:rgba(10,132,255,.16);padding:2px 7px;border-radius:5px;flex:0 0 auto}
.st-face{width:32px;height:32px;flex:0 0 32px;border-radius:7px;background:rgba(255,255,255,.06);display:inline-flex;align-items:center;justify-content:center}
.st-spin{width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 1.6px rgba(255,255,255,.18);border-top:1.6px solid var(--t2);box-sizing:border-box;flex:0 0 12px}
.st-tiles{display:flex;gap:14px;padding:14px 12px 12px;justify-content:space-between}
.st-tile{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--t2)}
.st-tile.on{color:var(--t1);font-weight:500}
.st-th{position:relative;width:124px;height:78px;border-radius:8px;overflow:hidden;background:#0e0e10;box-shadow:0 0 0 .5px rgba(255,255,255,.16)}
.st-tile.on .st-th{box-shadow:0 0 0 3px #0a84ff}
.st-th span{position:absolute;display:block}
.st-th .c{background:#151518;border-radius:3px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.st-th .l{height:2px;border-radius:1px;background:rgba(255,255,255,.22)}
.st-th .l.d{background:rgba(255,255,255,.12)}
.st-th .h{width:4px;height:4px;border-radius:1px;background:#8a6bd1}
.st-th .lt{width:3px;height:3px;border-radius:2px;background:#3a3a3e}
.st-th .g{border-radius:2px;background:rgba(255,255,255,.08)}
.st-th .s{border-radius:2px;background:rgba(255,255,255,.1)}
.st-th .a{height:2px;border-radius:1px;background:#ffb020}
.st-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 4px}
.st-hmk{width:56px;height:56px;border-radius:28px;background:#2c2c31;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.st-hn{font-size:17px;line-height:22px;font-weight:600;color:var(--t1);margin-top:4px}
.st-hs{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--t3)}
.st-about{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 28px}
.st-about .st-tag{font-size:13px;line-height:18px;color:var(--t2);margin-top:12px}
.st-about .st-ver{font-size:11px;line-height:14px;color:var(--t3);margin-top:6px}
.st-about .st-lic{font-size:11px;line-height:14px;color:var(--t4);margin-top:18px}
.st-lbl{font-size:13px;line-height:18px;font-weight:500;color:var(--t2);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.st-lbl span{color:var(--t3);font-weight:400}
.st-fr{display:flex;flex:0 0 auto}
.st-grid{display:grid;gap:40px 32px;align-items:start}
.st-mk.st-mki{background:none!important;box-shadow:none!important;border-radius:0!important}.st-mki img{display:block;width:28px;height:28px}
