<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>capcomd home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sb{--text:#F2F2F7;--sec:#A9A9B1;--ter:#8E8E96;--blue:#0A84FF;--amber:#FFB020;--green:#30D158;--red:#FF6961;--col:#151518;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45}
.sb *{box-sizing:border-box}
.mono{font-family:"SF Mono",ui-monospace,"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.lights{display:flex;gap:8px;padding-right:10px}
.lights span{width:12px;height:12px;border-radius:6px;background:#3a3a3e}
.deck{all:unset;display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.05);color:var(--sec);font-size:12.5px;white-space:nowrap;cursor:pointer}
.deck:hover{background:rgba(255,255,255,.08)}
.deck.ask{box-shadow:inset 0 0 0 1px rgba(255,176,32,.6);color:var(--text)}
.dk{display:inline-flex;align-items:center}
.dk span{width:22px;height:22px;border-radius:6px;background:#26262a;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px #0e0e10}
.dk span+span{margin-left:-14px}
.dk img{width:16px;height:16px;image-rendering:pixelated}
.tb{all:unset;width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ter);cursor:pointer}
.tb:hover{background:rgba(255,255,255,.06);color:var(--text)}
.tb.on{color:var(--text);background:rgba(255,255,255,.10)}
.tb:focus-visible,.deck:focus-visible,.pl:focus-visible,.it:focus-visible,.btn:focus-visible,.go:focus-visible,.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.composer{border-radius:16px;background:#1b1b1f;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -18px rgba(0,0,0,.7);padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;transition:box-shadow .18s ease}
.composer:focus-within{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),0 0 0 3px rgba(10,132,255,.22),0 18px 40px -18px rgba(0,0,0,.7)}
.mark{position:relative;width:84px;height:72px;margin:0 auto 22px;opacity:.42;-webkit-mask-image:repeating-conic-gradient(#000 0 25%,rgba(0,0,0,.55) 0 50%);-webkit-mask-size:2px 2px;mask-image:repeating-conic-gradient(#000 0 25%,rgba(0,0,0,.55) 0 50%);mask-size:2px 2px}
.hello{margin:0 0 22px;text-align:center;font-family:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.022em;color:#F5F5F7}
.hello span{display:block;margin-top:8px;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;font-size:14px;line-height:1.4;font-weight:400;letter-spacing:0;color:var(--ter)}
.pl{all:unset;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 6px 0 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--text);font-size:11.5px;cursor:pointer}
.pl:hover{background:rgba(255,255,255,.11)}
.pl.quiet{background:transparent;color:var(--ter)}
.seg{display:inline-flex;padding:2px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.seg button{all:unset;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;color:var(--ter);font-size:12px;cursor:pointer}
.seg button.on{color:var(--text);font-weight:500;background:#3a3a3f;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.drv{all:unset;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:8px;color:var(--sec);font-size:12px;cursor:pointer}
.drv:hover,.drv.open{background:rgba(255,255,255,.07);color:var(--text)}
.round{all:unset;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--sec);cursor:pointer}
.go{all:unset;width:30px;height:30px;border-radius:15px;background:#F2F2F7;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .15s ease}
.go:disabled{opacity:.3;cursor:default}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:240px;padding:5px;border-radius:10px;background:#1f1f23;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 12px 32px rgba(0,0,0,.55);animation:pop .14s ease-out both}
.menu.up{top:auto;bottom:calc(100% + 6px)}
.mh{padding:7px 9px 3px;font-size:11px;font-weight:600;color:var(--ter)}
.it{all:unset;box-sizing:border-box;width:100%;height:28px;padding:0 9px;border-radius:6px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);cursor:pointer}
.it:hover{background:rgba(10,132,255,.9)}
.it .note{margin-left:auto;color:var(--ter);font-size:11.5px}
.it:hover .note{color:rgba(255,255,255,.8)}
.check{width:12px;display:inline-flex;justify-content:center;color:var(--text)}
.sep{height:.5px;background:rgba(255,255,255,.1);margin:5px 4px}
.card{all:unset;box-sizing:border-box;display:block;width:100%;border-radius:11px;background:var(--col);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.09);cursor:pointer;transition:background .15s ease}
.card:hover{background:#18181c}
.card.ask{box-shadow:inset 0 0 0 1px rgba(255,176,32,.6)}
.rowbtn{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;border-radius:11px}
.rowbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{all:unset;height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn.inv{background:#F2F2F7;color:#1D1D1F;box-shadow:none;font-weight:600}
.btn.plain{box-shadow:none;color:var(--sec)}
.kbd{display:inline-flex;align-items:center;justify-content:center;height:18px;padding:0 4px;border-radius:4px;background:rgba(0,0,0,.12);font-size:11px}
.dot{width:7px;height:7px;border-radius:4px;flex:none}
.live{animation:breathe 1.6s ease-in-out infinite}
.in{animation:in .35s cubic-bezier(.22,1,.36,1) both}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
@keyframes breathe{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.sb *{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="sb" style="position: relative; width: 1440px; height: 900px; border-radius: 12px; background: #0e0e10; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12); overflow: hidden; display: flex; flex-direction: column">

  <header style="height: 60px; flex: 0 0 60px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px">
    <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
    <button class="tb on" aria-label="Home" aria-pressed="true" title="Home (⌘0)"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.2 8 2.8l5.5 4.4v6.3H9.6V10H6.4v3.5H2.5z" stroke="currentColor" fill="none" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
    <sc-for list="{{ decks }}" as="d" hint-placeholder-count="2">
      <button class="{{ d.cls }}" aria-label="{{ d.label }}">
        <sc-if value="{{ d.cloud }}" hint-placeholder-val="{{ true }}"><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M4.6 10.6h7.1a2.8 2.8 0 00.5-5.6 4 4 0 00-7.7-.8A3.2 3.2 0 004.6 10.6z" stroke="currentColor" fill="none" stroke-width="1.2" stroke-linejoin="round"/></svg></sc-if>
        <sc-if value="{{ d.local }}" hint-placeholder-val="{{ false }}"><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><rect x="2.6" y="1.6" width="10.8" height="7.2" rx="1.2" stroke="currentColor" fill="none" stroke-width="1.2"/><path d="M.9 10.6h14.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></sc-if>
        <span>{{ d.name }}</span>
        <span class="dk"><sc-for list="{{ d.heads }}" as="h" hint-placeholder-count="2"><span><img src="{{ h }}" alt=""></span></sc-for></span>
      </button>
    </sc-for>
    <span style="flex: 1"></span>
    <button style="all: unset; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border-radius: 8px; background: rgba(10,132,255,.16); color: #6CB4FF; font-size: 12px; font-weight: 500; cursor: pointer" aria-pressed="true"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" stroke="currentColor" fill="none" stroke-width="1.2"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>Follow</button>
    <button class="tb" aria-label="Actions (⌘K)"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 5.5h5v5h-5zM5.5 5.5V4a1.5 1.5 0 10-1.5 1.5h1.5zM10.5 5.5H12a1.5 1.5 0 10-1.5-1.5v1.5zM10.5 10.5V12a1.5 1.5 0 101.5-1.5h-1.5zM5.5 10.5H4a1.5 1.5 0 101.5 1.5v-1.5z" stroke="currentColor" fill="none" stroke-width="1.1"/></svg></button>
    <button class="tb" aria-label="New project (⇧⌘N)" onClick="{{ focusGoal }}"><svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></button>
  </header>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <button aria-label="Close the menu" onClick="{{ closeMenu }}" style="all: unset; position: absolute; inset: 0; z-index: 20"></button>
  </sc-if>

  <main style="flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center">
    <div style="width: 680px; padding: 96px 0 48px; display: flex; flex-direction: column">

      <!-- The onboarding bot's head, monochrome and dithered, very quiet: a mark, not a mascot. -->
      <div class="mark" aria-hidden="true"><div style="position: absolute; top: 0; left: -6px; width: 6px; height: 6px; box-shadow: 42px 0px 0 0 #A4A4AC, 48px 0px 0 0 #A4A4AC, 42px 6px 0 0 #5E5E66, 48px 6px 0 0 #5E5E66, 30px 12px 0 0 #8E8E96, 36px 12px 0 0 #8E8E96, 42px 12px 0 0 #8E8E96, 48px 12px 0 0 #8E8E96, 54px 12px 0 0 #8E8E96, 60px 12px 0 0 #8E8E96, 18px 18px 0 0 #8E8E96, 24px 18px 0 0 #8E8E96, 30px 18px 0 0 #B8B8C0, 36px 18px 0 0 #B8B8C0, 42px 18px 0 0 #8E8E96, 48px 18px 0 0 #8E8E96, 54px 18px 0 0 #8E8E96, 60px 18px 0 0 #8E8E96, 66px 18px 0 0 #8E8E96, 72px 18px 0 0 #8E8E96, 12px 24px 0 0 #8E8E96, 18px 24px 0 0 #B8B8C0, 24px 24px 0 0 #B8B8C0, 30px 24px 0 0 #8E8E96, 36px 24px 0 0 #8E8E96, 42px 24px 0 0 #8E8E96, 48px 24px 0 0 #8E8E96, 54px 24px 0 0 #8E8E96, 60px 24px 0 0 #8E8E96, 66px 24px 0 0 #8E8E96, 72px 24px 0 0 #8E8E96, 78px 24px 0 0 #8E8E96, 12px 30px 0 0 #8E8E96, 18px 30px 0 0 #141417, 24px 30px 0 0 #141417, 30px 30px 0 0 #141417, 36px 30px 0 0 #141417, 42px 30px 0 0 #141417, 48px 30px 0 0 #141417, 54px 30px 0 0 #141417, 60px 30px 0 0 #141417, 66px 30px 0 0 #141417, 72px 30px 0 0 #141417, 78px 30px 0 0 #8E8E96, 6px 36px 0 0 #6E6E76, 12px 36px 0 0 #8E8E96, 18px 36px 0 0 #141417, 24px 36px 0 0 #E4E4EA, 30px 36px 0 0 #141417, 36px 36px 0 0 #141417, 42px 36px 0 0 #141417, 48px 36px 0 0 #141417, 54px 36px 0 0 #141417, 60px 36px 0 0 #141417, 66px 36px 0 0 #E4E4EA, 72px 36px 0 0 #141417, 78px 36px 0 0 #8E8E96, 84px 36px 0 0 #6E6E76, 6px 42px 0 0 #6E6E76, 12px 42px 0 0 #8E8E96, 18px 42px 0 0 #141417, 24px 42px 0 0 #E4E4EA, 30px 42px 0 0 #141417, 36px 42px 0 0 #141417, 42px 42px 0 0 #141417, 48px 42px 0 0 #141417, 54px 42px 0 0 #141417, 60px 42px 0 0 #141417, 66px 42px 0 0 #E4E4EA, 72px 42px 0 0 #141417, 78px 42px 0 0 #8E8E96, 84px 42px 0 0 #6E6E76, 6px 48px 0 0 #6E6E76, 12px 48px 0 0 #8E8E96, 18px 48px 0 0 #7A7A82, 24px 48px 0 0 #141417, 30px 48px 0 0 #141417, 36px 48px 0 0 #E4E4EA, 42px 48px 0 0 #141417, 48px 48px 0 0 #141417, 54px 48px 0 0 #E4E4EA, 60px 48px 0 0 #141417, 66px 48px 0 0 #141417, 72px 48px 0 0 #7A7A82, 78px 48px 0 0 #8E8E96, 84px 48px 0 0 #6E6E76, 12px 54px 0 0 #8E8E96, 18px 54px 0 0 #141417, 24px 54px 0 0 #141417, 30px 54px 0 0 #141417, 36px 54px 0 0 #141417, 42px 54px 0 0 #E4E4EA, 48px 54px 0 0 #E4E4EA, 54px 54px 0 0 #141417, 60px 54px 0 0 #141417, 66px 54px 0 0 #141417, 72px 54px 0 0 #141417, 78px 54px 0 0 #8E8E96, 12px 60px 0 0 #5E5E66, 18px 60px 0 0 #8E8E96, 24px 60px 0 0 #8E8E96, 30px 60px 0 0 #8E8E96, 36px 60px 0 0 #8E8E96, 42px 60px 0 0 #8E8E96, 48px 60px 0 0 #8E8E96, 54px 60px 0 0 #8E8E96, 60px 60px 0 0 #8E8E96, 66px 60px 0 0 #8E8E96, 72px 60px 0 0 #8E8E96, 78px 60px 0 0 #5E5E66, 18px 66px 0 0 #5E5E66, 24px 66px 0 0 #5E5E66, 30px 66px 0 0 #5E5E66, 36px 66px 0 0 #5E5E66, 42px 66px 0 0 #5E5E66, 48px 66px 0 0 #5E5E66, 54px 66px 0 0 #5E5E66, 60px 66px 0 0 #5E5E66, 66px 66px 0 0 #5E5E66, 72px 66px 0 0 #5E5E66"></div></div>
      <h1 class="hello">What are we building?<span>Describe it once. The planner splits it up and brings in a crew.</span></h1>

      <div class="composer" role="group" aria-label="New project" style="position: relative; z-index: 25">
        <div style="display: flex; align-items: center; gap: 4px">
          <div style="position: relative">
            <button class="pl" aria-haspopup="menu" aria-expanded="{{ m.folder }}" onClick="{{ openFolder }}"><svg width="12" height="10" viewBox="0 0 16 13" aria-hidden="true"><path d="M1.5 2.5h4.5l1.5 1.5h7v7.5h-13z" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linejoin="round"/></svg>{{ folder }}<svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" stroke="var(--ter)" fill="none" stroke-width="1.4"/></svg></button>
            <sc-if value="{{ m.folder }}" hint-placeholder-val="{{ false }}">
              <div class="menu" role="menu" aria-label="Project folder">
                <div class="mh">Recent</div>
                <sc-for list="{{ folders }}" as="f" hint-placeholder-count="3">
                  <button class="it" role="menuitemradio" aria-checked="{{ f.on }}" onClick="{{ f.pick }}"><span class="check">{{ f.mark }}</span>{{ f.name }}<span class="note mono">{{ f.path }}</span></button>
                </sc-for>
                <div class="sep"></div>
                <button class="it" onClick="{{ closeMenu }}"><span class="check"></span>Choose a folder…<span class="note">⌘O</span></button>
              </div>
            </sc-if>
          </div>
          <span class="pl quiet" style="cursor: default"><svg width="10" height="11" viewBox="0 0 10 12" aria-hidden="true"><circle cx="3" cy="2.5" r="1.4" stroke="currentColor" fill="none" stroke-width="1.1"/><circle cx="3" cy="9.5" r="1.4" stroke="currentColor" fill="none" stroke-width="1.1"/><circle cx="7.5" cy="4" r="1.4" stroke="currentColor" fill="none" stroke-width="1.1"/><path d="M3 4v4M7.5 5.4c0 2-3 1.8-4.5 3" stroke="currentColor" fill="none" stroke-width="1.1"/></svg>{{ branch }}</span>
        </div>
        <label for="goal" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Describe a project for your agents</label>
        <textarea id="goal" placeholder="Describe a project for your agents…" rows="2" value="{{ goal }}" onChange="{{ setGoal }}" style="all: unset; display: block; padding: 4px 4px; min-height: 50px; font-size: 15px; line-height: 1.5; letter-spacing: -.005em; color: var(--text); white-space: pre-wrap"></textarea>
        <div style="display: flex; align-items: center; gap: 6px; height: 32px">
          <button class="round" aria-label="Add a folder, file or skill" style="box-shadow: inset 0 0 0 .5px rgba(255,255,255,.22)"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></button>
          <span class="seg" role="radiogroup" aria-label="Where it runs">
            <button role="radio" class="{{ seg.local }}" aria-checked="{{ seg.isLocal }}" onClick="{{ pickLocal }}"><svg width="14" height="10" viewBox="0 0 16 12" aria-hidden="true"><rect x="2.6" y="1.6" width="10.8" height="7.2" rx="1.2" stroke="currentColor" fill="none" stroke-width="1.3"/><path d="M.9 10.6h14.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Local</button>
            <button role="radio" class="{{ seg.cloud }}" aria-checked="{{ seg.isCloud }}" onClick="{{ pickCloud }}"><svg width="14" height="10" viewBox="0 0 16 12" aria-hidden="true"><path d="M4.6 10.6h7.1a2.8 2.8 0 00.5-5.6 4 4 0 00-7.7-.8A3.2 3.2 0 004.6 10.6z" stroke="currentColor" fill="none" stroke-width="1.3" stroke-linejoin="round"/></svg>Cloud</button>
          </span>
          <div style="position: relative">
            <button class="{{ drvCls }}" aria-haspopup="menu" aria-expanded="{{ m.driver }}" aria-label="{{ drvLabel }}" onClick="{{ openDriver }}">{{ driver.name }}
              <svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><rect x="0.5" y="6" width="2.4" height="3.5" rx=".5" fill="{{ bars.a }}"/><rect x="4.3" y="3.5" width="2.4" height="6" rx=".5" fill="{{ bars.b }}"/><rect x="8.1" y="1" width="2.4" height="8.5" rx=".5" fill="{{ bars.c }}"/></svg>
              <svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" stroke="currentColor" fill="none" stroke-width="1.4"/></svg>
            </button>
            <sc-if value="{{ m.driver }}" hint-placeholder-val="{{ false }}">
              <div class="menu" role="menu" aria-label="Planner model" style="min-width: 260px">
                <div class="mh">Claude Code</div>
                <sc-for list="{{ claude }}" as="o" hint-placeholder-count="3"><button class="it" role="menuitemradio" aria-checked="{{ o.on }}" onClick="{{ o.pick }}"><span class="check">{{ o.mark }}</span>{{ o.name }}<span class="note">{{ o.note }}</span></button></sc-for>
                <div class="mh">Codex</div>
                <sc-for list="{{ codex }}" as="o" hint-placeholder-count="1"><button class="it" role="menuitemradio" aria-checked="{{ o.on }}" onClick="{{ o.pick }}"><span class="check">{{ o.mark }}</span>{{ o.name }}<span class="note">{{ o.note }}</span></button></sc-for>
                <div class="sep"></div>
                <div class="mh">Effort</div>
                <div style="padding: 4px 6px 6px"><span class="seg" role="radiogroup" aria-label="Effort" style="display: flex">
                  <sc-for list="{{ efforts }}" as="e" hint-placeholder-count="4"><button role="radio" class="{{ e.cls }}" aria-checked="{{ e.on }}" onClick="{{ e.pick }}" style="flex: 1; justify-content: center">{{ e.name }}</button></sc-for>
                </span></div>
              </div>
            </sc-if>
          </div>
          <span style="flex: 1"></span>
          <button class="round" aria-label="Dictate the goal (hold fn)" title="Dictate · hold fn" style="width: 30px; height: 30px; border-radius: 15px"><svg width="14" height="15" viewBox="0 0 14 15" aria-hidden="true"><rect x="4.6" y="1.2" width="4.8" height="8" rx="2.4" stroke="currentColor" fill="none" stroke-width="1.3"/><path d="M2 7.2a5 5 0 0010 0M7 12.2v2" stroke="currentColor" fill="none" stroke-width="1.3" stroke-linecap="round"/></svg></button>
          <button class="go" aria-label="Start the project" disabled="{{ noGoal }}" onClick="{{ start }}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2M2.5 5.5L6 2l3.5 3.5" stroke="#1D1D1F" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>

      <section aria-labelledby="running-h" style="margin-top: 56px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; gap: 8px; padding: 0 4px 2px">
          <h2 id="running-h" style="margin: 0; font-size: 12.5px; font-weight: 600; color: var(--sec)">Running</h2>
          <span style="font-size: 12px; color: var(--ter)">{{ runningCount }}</span>
        </div>
        <sc-for list="{{ runs }}" as="r" hint-placeholder-count="2">
          <div class="{{ r.cls }}">
            <button class="rowbtn" aria-label="{{ r.label }}" style="padding: 0 14px; height: 48px">
              <span style="display: flex; align-items: center; gap: 10px">
                <sc-if value="{{ r.cloud }}" hint-placeholder-val="{{ true }}"><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true" style="color: #C7C7CE; flex: none"><path d="M4.6 10.6h7.1a2.8 2.8 0 00.5-5.6 4 4 0 00-7.7-.8A3.2 3.2 0 004.6 10.6z" stroke="currentColor" fill="none" stroke-width="1.2" stroke-linejoin="round"/></svg></sc-if>
                <sc-if value="{{ r.local }}" hint-placeholder-val="{{ false }}"><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true" style="color: #C7C7CE; flex: none"><rect x="2.6" y="1.6" width="10.8" height="7.2" rx="1.2" stroke="currentColor" fill="none" stroke-width="1.2"/><path d="M.9 10.6h14.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></sc-if>
                <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-size: 13px; font-weight: 600">{{ r.title }}</span><span style="font-size: 12.5px; color: var(--sec)">  ·  {{ r.sentence }}</span></span>
                <span class="dk"><sc-for list="{{ r.heads }}" as="h" hint-placeholder-count="3"><span><img src="{{ h }}" alt=""></span></sc-for></span>
                <span class="mono" style="font-size: 12px; color: var(--ter); width: 40px; text-align: right">{{ r.elapsed }}</span>
              </span>
            </button>
            <sc-if value="{{ r.asking }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; align-items: center; gap: 8px; padding: 0 10px 10px 40px; margin-top: -4px">
                <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-size: 13px; font-weight: 500">{{ r.question }}</span><span style="font-size: 12.5px; color: var(--sec)">  {{ r.evidence }}</span></span>
                <button class="btn" onClick="{{ r.deny }}">Deny</button>
                <button class="btn inv" onClick="{{ r.approve }}">Approve <span class="kbd">↩</span></button>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </section>

    </div>
  </main>
</div>

<script type="text/x-dc" data-dc-script data-props='{"live":{"editor":"boolean","default":true,"section":"Prototype"},"$preview":{"width":1440,"height":900}}'>
const BOT = {
  happy: "bots/new-full-happy.svg", sleepy: "bots/new-full-sleepy.svg", small: "bots/new-small.svg",
  mkPlanner: "bots/mk-planner-0-xs.svg", mkLead: "bots/mk-lead-1-xs.svg", mkW2: "bots/mk-worker-2-xs.svg",
  mkW3: "bots/mk-worker-3-xs.svg", mkCritic: "bots/mk-critic-5-xs.svg",
  prPlanner: "bots/pr-planner-0-xs.svg", prWorker: "bots/pr-worker-1-xs.svg", prCritic: "bots/pr-critic-2-xs.svg"
};
const FOLDERS = [
  { name: "addriva", path: "~/code/addriva", branch: "main" },
  { name: "billing", path: "~/code/billing", branch: "dev" },
  { name: "my-app", path: "~/Developer/my-app", branch: "main" }
];
const DRIVERS = [
  { id: "opus", harness: "claude", name: "Opus 5.5", note: "Most capable" },
  { id: "sonnet", harness: "claude", name: "Sonnet 5.5", note: "Balanced" },
  { id: "haiku", harness: "claude", name: "Haiku 5.5", note: "Fastest" },
  { id: "gpt", harness: "codex", name: "GPT-5.6", note: "Codex" }
];
const EFFORTS = ["Auto", "Low", "Medium", "High"];
// What each run's crew is doing, as one sentence that changes while you watch (the menu bar's direction B).
const SENTENCES = {
  m: ["writing shards, 118 of 256", "writing shards, 131 of 256", "writing shards, 140 of 256"],
  p: ["updating the proration maths", "running 212 billing tests", "reviewing the change"]
};
const fmt = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.timers = [];
    this.state = {
      menu: null, folder: 0, cloud: true, driver: "opus", effort: 0, goal: "", tick: 0, n: 0,
      runs: [
        { id: "m", title: "Migrate matchkey to v3.2", where: "Cloud · boxd eu-1", cloud: true, base: 1120, line: 0, heads: [BOT.mkPlanner, BOT.mkLead, BOT.mkW2, BOT.mkW3], ask: { question: "Merge 4423's work into main?", evidence: "3 files, +73 −5" } },
        { id: "p", title: "Fix proration for annual plans", where: "Local · Docker", cloud: false, base: 375, line: 0, heads: [BOT.prPlanner, BOT.prWorker, BOT.prCritic] }
      ],
      recent: [
        { goal: "Backfill addriva_id for 2023 accounts", status: "Landed on main", color: "#30D158", when: "1 h ago" },
        { goal: "Speed up the billing test suite", status: "Ready for a PR", color: "#30D158", when: "3 h ago" },
        { goal: "Move config loading to the new schema", status: "Checks failed", color: "#FF6961", when: "Yesterday" }
      ]
    };
  }
  componentDidMount() {
    this.clock = setInterval(() => {
      if (this.props.live === false) return;
      const t = this.state.tick + 1;
      const runs = t % 4 === 0 ? this.state.runs.map((r) => SENTENCES[r.id] ? Object.assign({}, r, { line: (r.line + 1) % SENTENCES[r.id].length }) : r) : this.state.runs;
      this.setState({ tick: t, runs: runs });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.clock); this.timers.forEach((x) => clearTimeout(x)); }
  later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
  update(id, patch) { this.setState({ runs: this.state.runs.map((r) => r.id === id ? Object.assign({}, r, typeof patch === "function" ? patch(r) : patch) : r) }); }
  finish(id, status, color) {
    const r = this.state.runs.find((x) => x.id === id);
    if (!r) return;
    this.setState({ runs: this.state.runs.filter((x) => x.id !== id), recent: [{ goal: r.title, status: status, color: color, when: "now" }].concat(this.state.recent).slice(0, 4) });
  }
  start() {
    const goal = this.state.goal.trim();
    if (!goal) return;
    const id = "new" + this.state.n, f = FOLDERS[this.state.folder];
    const run = { id: id, title: goal, where: (this.state.cloud ? "Cloud · boxd eu-1" : "Local · Docker") + " · " + f.name, cloud: this.state.cloud, base: -this.state.tick, line: 0, heads: [BOT.small], text: "reading " + f.name };
    this.setState({ runs: [run].concat(this.state.runs), goal: "", n: this.state.n + 1, menu: null });
    this.later(1800, () => this.update(id, { text: "bringing in the crew" }));
    [BOT.mkW2, BOT.mkW3, BOT.mkCritic].forEach((h, i) => this.later(2600 + i * 500, () => this.update(id, (r) => ({ heads: r.heads.concat([h]) }))));
    this.later(4400, () => this.update(id, { text: "3 workers building" }));
  }
  renderVals() {
    const s = this.state, t = s.tick, f = FOLDERS[s.folder], d = DRIVERS.find((x) => x.id === s.driver);
    const toggle = (k) => () => this.setState({ menu: s.menu === k ? null : k });
    const bar = (on) => on ? "currentColor" : "rgba(255,255,255,.18)";
    const lvl = [3, 1, 2, 3][s.effort];
    const opt = (x) => ({ name: x.name, note: x.note, on: x.id === s.driver, mark: x.id === s.driver ? "✓" : "", pick: () => this.setState({ driver: x.id }) });
    const asking = s.runs.some((r) => r.ask);
    return {
      decks: s.runs.map((r) => ({
        cls: "deck" + (r.ask ? " ask" : ""), label: r.title + (r.ask ? ", asks" : ""), cloud: r.cloud, local: !r.cloud,
        name: r.title.length > 22 ? r.title.slice(0, 20) + "…" : r.title, heads: r.heads.slice(0, 3)
      })),
      focusGoal: () => { try { const el = document.getElementById("goal"); if (el) el.focus(); } catch (e) {} },
      menuOpen: !!s.menu, closeMenu: () => this.setState({ menu: null }), m: { folder: s.menu === "folder", driver: s.menu === "driver" },
      bot: s.goal.trim() ? BOT.happy : BOT.sleepy, botAlt: s.goal.trim() ? "Lumen, the bot that will plan this project, smiling" : "Lumen, the bot that will plan this project, sleepy",
      folder: f.name, branch: f.branch, openFolder: toggle("folder"),
      folders: FOLDERS.map((x, i) => ({ name: x.name, path: x.path, on: i === s.folder, mark: i === s.folder ? "✓" : "", pick: () => this.setState({ folder: i, menu: null }) })),
      goal: s.goal, setGoal: (e) => this.setState({ goal: e.target.value }), noGoal: !s.goal.trim(), start: () => this.start(),
      seg: { local: s.cloud ? "" : "on", cloud: s.cloud ? "on" : "", isLocal: !s.cloud, isCloud: s.cloud },
      pickLocal: () => this.setState({ cloud: false }), pickCloud: () => this.setState({ cloud: true }),
      driver: d, drvCls: "drv" + (s.menu === "driver" ? " open" : ""), openDriver: toggle("driver"),
      drvLabel: "Planner: " + (d.harness === "claude" ? "Claude Code" : "Codex") + ", " + d.name + ", " + EFFORTS[s.effort].toLowerCase() + " effort",
      bars: { a: bar(lvl >= 1), b: bar(lvl >= 2), c: bar(lvl >= 3) },
      claude: DRIVERS.filter((x) => x.harness === "claude").map(opt), codex: DRIVERS.filter((x) => x.harness === "codex").map(opt),
      efforts: EFFORTS.map((e, i) => ({ name: e, on: i === s.effort, cls: i === s.effort ? "on" : "", pick: () => this.setState({ effort: i }) })),
      runningCount: s.runs.length,
      runs: s.runs.map((r) => ({
        cls: "card in" + (r.ask ? " ask" : ""), label: r.title + ". Opens it in the reel", title: r.title, where: r.where, cloud: r.cloud, local: !r.cloud,
        sentence: r.text || (SENTENCES[r.id] ? SENTENCES[r.id][r.line] : ""), heads: r.heads, elapsed: fmt(Math.max(0, r.base + t)),
        asking: !!r.ask, question: r.ask ? r.ask.question : "", evidence: r.ask ? r.ask.evidence : "",
        approve: () => { this.update(r.id, { ask: null, text: "merging into main" }); this.later(2200, () => this.finish(r.id, "Landed on main", "#30D158")); },
        deny: () => this.update(r.id, { ask: null, text: "reworking the join" })
      })),
      recent: s.recent
    };
  }
}
</script>
