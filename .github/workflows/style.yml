name: Style

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: capcomd-style-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changed-file-style:
    name: Changed-file style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Collect changed JavaScript and TypeScript files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          git diff --name-only --diff-filter=ACMRT -z "$BASE" HEAD > "$RUNNER_TEMP/style-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              *.gen.ts) ;;
              *.js|*.cjs|*.mjs|*.jsx|*.ts|*.cts|*.mts|*.tsx) printf '%s\0' "$path" ;;
            esac
          done < "$RUNNER_TEMP/style-paths" > "$RUNNER_TEMP/style-files"
          if [[ -s "$RUNNER_TEMP/style-files" ]]; then
            echo "has-files=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.has-files == 'true'
        with:
          bun-version-file: .bun-version
      - name: Install style tools
        if: steps.changes.outputs.has-files == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/style-tools"
          bun add --cwd "$RUNNER_TEMP/style-tools" --exact oxlint@1.94.0 oxfmt@0.79.0
      - name: Check lint and formatting
        if: steps.changes.outputs.has-files == 'true'
        run: |
          files=()
          while IFS= read -r -d '' path; do files+=("$path"); done < "$RUNNER_TEMP/style-files"
          result=0
          timeout 5s "$RUNNER_TEMP/style-tools/node_modules/.bin/oxlint" --deny-warnings -- "${files[@]}" || result=1
          "$RUNNER_TEMP/style-tools/node_modules/.bin/oxfmt" --check -- "${files[@]}" || result=1
          exit "$result"
