name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Run unit tests
        run: bun test tests/machines/*.test.ts

      # ADR-017 regression gate: agentic scenarios (scripted agents driving in-VM capcomd), tokens, MCP, skill gating.
      - name: Sub-agent scenario suite (regression gate)
        run: bun run test:scenarios
        timeout-minutes: 20

      - name: Run chaos tests - deterministic killpoints
        run: |
          export RELAY_KILLPOINT=tx.mid:1
          bun test tests/chaos/killpoints.test.ts || true
          
          export RELAY_KILLPOINT=model.after_return.before_commit:1
          bun test tests/chaos/killpoints.test.ts || true
          
          export RELAY_KILLPOINT=budget.charge.mid:1
          bun test tests/chaos/killpoints.test.ts || true
          
          export RELAY_KILLPOINT=vm.create.after_request.before_record:1
          bun test tests/chaos/killpoints.test.ts || true
          
          export RELAY_KILLPOINT=lease.expire.mid:1
          bun test tests/chaos/killpoints.test.ts || true

  chaos-nightly:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: chaos:fast (strict: any host stall fails the run; 8 workers)
        run: bun run chaos:fast
        env:
          CHAOS_STRICT: "1"
          CHAOS_WORKERS: "8"
        timeout-minutes: 45

      - name: Run randomized chaos tests
        run: |
          for i in {1..200}; do
            echo "Chaos iteration $i"
            CHAOS_SEED=$i bun test tests/chaos/random.test.ts || exit 1
          done
        timeout-minutes: 60
