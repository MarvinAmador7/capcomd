name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: CHANGELOG.md has an Unreleased section and agrees with package.json's and the plugin's version
        run: bun scripts/release-notes.ts --check

      - name: The Claude Code plugin and marketplace validate
        run: |
          bunx @anthropic-ai/claude-code plugin validate --strict plugins/capcomd
          bunx @anthropic-ai/claude-code plugin validate --strict .

      - name: Install dependencies (CLI/engine, apps/canvas, apps/tui)
        run: bun run setup

      - name: openapi/capcomd.json, docs/events.md and docs/harness-contract.md match src/api
        run: bun scripts/gen-harness-contract.ts --check

      - name: Type check
        run: bun run typecheck

      - name: Unit, CLI, setup and config, state machines, TUI
        run: |
          bun run test:fast
          (cd apps/tui && bun test)

  # ADR-017 regression gate: agentic scenarios (scripted agents driving in-VM capcomd), tokens, MCP, skill gating.
  # About 30 minutes on one runner, so it runs as six shards balanced by tests/scenario-timings.json (per-file times
  # measured on this runner; refresh with `bun run test:scenarios:timings`). A file missing from it gets an estimate.
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (CLI/engine, apps/canvas, apps/tui)
        run: bun run setup

      - name: Sub-agent scenario suite, shard ${{ matrix.shard }} of 6 (regression gate)
        run: bun test --shard=${{ matrix.shard }}/6 --timings=tests/scenario-timings.json tests/scenarios tests/subagents tests/primitives/policy.test.ts

  # The single executable (scripts/build-binary.ts): built for Linux and driven like a user's install (install.sh,
  # no Bun on the PATH, fake agents), so a change that breaks the binary (a file read at run time, a dependency that
  # loads something by a computed name) fails here, not at release.
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install

      - name: Build capcomd-linux-x64
        run: bun scripts/build-binary.ts --target linux-x64 --outdir dist

      - name: Install it and drive it (scripts/release-smoke.sh)
        run: scripts/release-smoke.sh dist/capcomd-linux-x64 "$(bun -e 'console.log(require("./package.json").version)')"
