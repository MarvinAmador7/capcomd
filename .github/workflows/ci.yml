name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"   # nightly: the full chaos rounds
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: CHANGELOG.md has an Unreleased section and agrees with package.json's and the plugin's version
        run: bun scripts/release-notes.ts --check

      - name: The Claude Code plugin and marketplace validate
        run: |
          bunx @anthropic-ai/claude-code plugin validate --strict plugins/capcomd
          bunx @anthropic-ai/claude-code plugin validate --strict .

      - name: Install dependencies (CLI/engine, apps/canvas, apps/tui)
        run: bun run setup

      - name: openapi/capcomd.json, docs/events.md and docs/harness-contract.md match src/api
        run: bun scripts/gen-harness-contract.ts --check

      - name: Type check
        run: bun run typecheck

      - name: Unit, CLI, setup and config, state machines, TUI
        run: |
          bun run test:fast
          (cd apps/tui && bun test)

      # ADR-017 regression gate: agentic scenarios (scripted agents driving in-VM capcomd), tokens, MCP, skill gating.
      # About 18 minutes on a Mac and longer on this runner since the workflow, upgrade and restart drills joined it.
      - name: Sub-agent scenario suite (regression gate)
        run: bun run test:scenarios
        timeout-minutes: 40

  # The single executable (scripts/build-binary.ts): built for Linux and driven like a user's install (install.sh,
  # no Bun on the PATH, fake agents), so a change that breaks the binary (a file read at run time, a dependency that
  # loads something by a computed name) fails here, not at release.
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install

      - name: Build capcomd-linux-x64
        run: bun scripts/build-binary.ts --target linux-x64 --outdir dist

      - name: Install it and drive it (scripts/release-smoke.sh)
        run: scripts/release-smoke.sh dist/capcomd-linux-x64 "$(bun -e 'console.log(require("./package.json").version)')"

  # Crash-safety gate (chaos:fast, strict), sharded so each suite gets its own runner: on one 2-vCPU runner the
  # 258 cases took ~45 min, right at the timeout. On push: one round (a regression check, ~10-15 min per shard);
  # nightly and on demand: the full three rounds.
  chaos:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [killpoints, recipe, primitives, seeds]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install

      - name: "chaos:fast ${{ matrix.suite }} (strict; 1 round on push, 3 nightly)"
        run: bun tests/chaos/fast.ts --only ${{ matrix.suite }} --rounds ${{ github.event_name == 'push' && 1 || 3 }}
        env:
          CHAOS_STRICT: "1"
          CHAOS_WORKERS: "4"
        timeout-minutes: 45
