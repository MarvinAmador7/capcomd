name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"   # nightly: the full chaos rounds
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (CLI/engine, apps/canvas, apps/tui)
        run: bun run setup

      - name: Type check
        run: bun run typecheck

      - name: Unit, CLI, setup and config, state machines, TUI
        run: |
          bun run test:fast
          (cd apps/tui && bun test)

      # ADR-017 regression gate: agentic scenarios (scripted agents driving in-VM capcomd), tokens, MCP, skill gating.
      - name: Sub-agent scenario suite (regression gate)
        run: bun run test:scenarios
        timeout-minutes: 20

  # Crash-safety gate (chaos:fast, strict), sharded so each suite gets its own runner: on one 2-vCPU runner the
  # 258 cases took ~45 min, right at the timeout. On push: one round (a regression check, ~10-15 min per shard);
  # nightly and on demand: the full three rounds.
  chaos:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [killpoints, recipe, primitives, seeds]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install

      - name: "chaos:fast ${{ matrix.suite }} (strict; 1 round on push, 3 nightly)"
        run: bun tests/chaos/fast.ts --only ${{ matrix.suite }} --rounds ${{ github.event_name == 'push' && 1 || 3 }}
        env:
          CHAOS_STRICT: "1"
          CHAOS_WORKERS: "4"
        timeout-minutes: 45
