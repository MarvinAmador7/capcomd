name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A new revision of the same PR supersedes its previous results.
concurrency:
  group: capcomd-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: CHANGELOG.md has an Unreleased section and agrees with package.json's and the plugin's version
        run: bun scripts/release-notes.ts --check

      - name: Change notes in changes/ parse
        run: bun scripts/changes.ts --check

      - name: The Claude Code plugin and marketplace validate
        run: |
          bunx @anthropic-ai/claude-code plugin validate --strict plugins/capcomd
          bunx @anthropic-ai/claude-code plugin validate --strict .

      - name: Install dependencies (CLI/engine, apps/canvas, apps/tui)
        run: bun run setup

      - name: openapi/capcomd.json, docs/events.md and docs/harness-contract.md match src/api
        run: bun scripts/gen-harness-contract.ts --check

      - name: src/primitives/title-shim.gen.ts matches title-rules.mjs
        run: bun scripts/gen-title-shim.ts --check

      - name: src/context/limits.gen.ts matches docs/evidence/context
        run: bun scripts/gen-context-limits.ts --check

      # The budget is 5 s (about 3 s on a normal runner). Going over it is a warning, not a failure: a slow runner
      # once took just over 5 s and failed a release PR. Only a hang (60 s) fails the step.
      - name: Type check
        run: |
          start=$(date +%s%N)
          timeout 60s bun run typecheck
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "typecheck took ${ms} ms"
          if [ "$ms" -gt 5000 ]; then
            echo "::warning title=Typecheck over its 5 s budget::bun run typecheck took ${ms} ms"
          fi

      - name: Unit, CLI, setup and config, state machines, plugins, packages
        run: bun run test:fast --parallel="$(nproc)"

      - name: The canvas and the TUI (apps/canvas, apps/tui)
        run: bun run test:apps

  # The regression gate: agentic scenarios (scripted agents driving in-VM capcomd), tokens, MCP, skill gating, the
  # sub-agents, the primitives, the agent adapters (fake CLIs) and the merge paths (local bare repos, a fake GitHub
  # and forge): `bun run test:scenarios`. Over 35 minutes on one runner, so it runs as seven shards balanced by
  # tests/scenario-timings.json (per-file times measured on this runner; a file missing from it gets an estimate).
  # Within a shard, run isolated files in parallel across the available runner cores.
  # Each shard uploads the times it measured (scenario-timings-N): `bun scripts/scenario-timings.ts <run id>` merges
  # a run's into the file. `--isolate` (in the script) gives every file a fresh global, environment and preload.
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (CLI/engine, apps/canvas, apps/tui)
        run: bun run setup

      - name: Scenario suite, shard ${{ matrix.shard }} of 7 (regression gate)
        run: |
          cp tests/scenario-timings.json "$RUNNER_TEMP/scenario-timings.json"
          bun run test:scenarios --parallel="$(nproc)" --shard=${{ matrix.shard }}/7 --timings="$RUNNER_TEMP/scenario-timings.json" --update-timings

      - name: Upload the times this shard measured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/scenario-timings.json
          retention-days: 14

  # The deterministic evals (fakes: no VMs, no models): the primitives' recipes (correctness; their latency against
  # evals/primitives/baseline.json, a developer machine's, is printed but doesn't fail on a shared runner),
  # `capcomd run --recipe` against `--legacy` on the same goals, and the context eval's harness.
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [primitives, recipe-parity, context]
    env:
      CAPCOMD_NO_CONFIG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Primitives eval
        if: matrix.suite == 'primitives'
        run: bun evals/primitives/run.ts --report-latency

      - name: Recipe parity eval
        if: matrix.suite == 'recipe-parity'
        run: bun evals/recipe-parity/run.ts

      # ADR-025 §12: the context eval's harness on the fake sandbox with its scripted agent (every runnable arm, every
      # task chain, the hidden checkers through `capcomd check`, the metrics); --expect fails on any verdict the fake
      # agent's policy doesn't produce. The live baselines per model are in docs/evidence/context/.
      - name: Context eval (fake sandbox and agent)
        if: matrix.suite == 'context'
        run: bun scripts/eval-context.ts --seed 1 --expect --port 6571 --arms none,agents-md,index,index-paths,index-k1,index-k3,index-triggered,index-noskills

  # @capcomd/plugin as it would be published (packages/plugin/scripts/pack.ts): installed from its tarball into a fresh
  # project and used from Node 20, the oldest it supports (no Bun at run time: every entry point, the test kit, connect()
  # over a Unix socket), and its declarations typechecked by a TypeScript 5 consumer under nodenext. The examples are
  # tested in test:fast (packages/plugin, tests/plugins/host.test.ts) and the Slack example against a real daemon on the
  # fake sandbox in the scenarios (tests/scenarios/plugin-slack-example.test.ts).
  plugin-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      - name: Pack @capcomd/plugin
        run: bun packages/plugin/scripts/pack.ts --out dist/plugin

      - name: Install it and use it from Node (packages/plugin/scripts/smoke.sh)
        run: packages/plugin/scripts/smoke.sh dist/plugin/capcomd-plugin-*.tgz

  # The npm package (`bun pm pack`) installed the way a user installs it, `bun add -g` with no lockfile, so its
  # dependencies resolve as they would for a user today, and driven with fake agents (scripts/release-smoke.sh): every
  # @rivet-dev/services it resolved is the version package.json pins, and its engine starts rivet-services as on a
  # user's default port. A dependency release that breaks a fresh install (rivet-services 0.2.5 under rivetkit 2.3.31, 2026-11-10) fails here.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: bun pm pack
        run: mkdir dist && bun pm pack --destination dist

      - name: Install it with a fresh HOME and drive it (scripts/release-smoke.sh)
        run: scripts/release-smoke.sh dist/capcomd-*.tgz "$(bun -e 'console.log(require("./package.json").version)')"

  # The single executable (scripts/build-binary.ts): built for Linux and driven like a user's install (install.sh,
  # no Bun on the PATH, fake agents), so a change that breaks the binary (a file read at run time, a dependency that
  # loads something by a computed name) fails here, not at release.
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install

      - name: Build capcomd-linux-x64
        run: bun scripts/build-binary.ts --target linux-x64 --outdir dist

      - name: Install it and drive it (scripts/release-smoke.sh)
        run: scripts/release-smoke.sh dist/capcomd-linux-x64 "$(bun -e 'console.log(require("./package.json").version)')"

  # Keep a stable required check on both PRs and merge groups. The queue also
  # exercises the macOS app on the exact candidate commit.
  merge-queue-menubar:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/menubar.yml

  gate:
    name: CI gate
    if: always()
    needs: [test, scenarios, evals, plugin-package, package, binary, merge-queue-menubar]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT" '
            to_entries | all(
              if .key == "merge-queue-menubar" and $event != "merge_group"
              then .value.result == "skipped"
              else .value.result == "success"
              end
            )
          ' <<< "$RESULTS"
