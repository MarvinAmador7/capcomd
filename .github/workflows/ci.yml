name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: CHANGELOG.md has an Unreleased section and agrees with package.json's and the plugin's version
        run: bun scripts/release-notes.ts --check

      - name: The Claude Code plugin and marketplace validate
        run: |
          bunx @anthropic-ai/claude-code plugin validate --strict plugins/capcomd
          bunx @anthropic-ai/claude-code plugin validate --strict .

      - name: Install dependencies (CLI/engine, apps/canvas, apps/tui)
        run: bun run setup

      - name: openapi/capcomd.json, docs/events.md and docs/harness-contract.md match src/api
        run: bun scripts/gen-harness-contract.ts --check

      - name: src/primitives/title-shim.gen.ts matches title-rules.mjs
        run: bun scripts/gen-title-shim.ts --check

      - name: src/context/limits.gen.ts matches docs/evidence/context
        run: bun scripts/gen-context-limits.ts --check

      - name: Type check
        run: bun run typecheck

      - name: Unit, CLI, setup and config, state machines, plugins, packages
        run: bun run test:fast

      - name: The canvas and the TUI (apps/canvas, apps/tui)
        run: bun run test:apps

  # The regression gate: agentic scenarios (scripted agents driving in-VM capcomd), tokens, MCP, skill gating, the
  # sub-agents, the primitives, the agent adapters (fake CLIs) and the merge paths (local bare repos, a fake GitHub
  # and forge): `bun run test:scenarios`. Over 35 minutes on one runner, so it runs as seven shards balanced by
  # tests/scenario-timings.json (per-file times measured on this runner; a file missing from it gets an estimate).
  # Each shard uploads the times it measured (scenario-timings-N): `bun scripts/scenario-timings.ts <run id>` merges
  # a run's into the file. `--isolate` (in the script) gives every file a fresh global, environment and preload.
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (CLI/engine, apps/canvas, apps/tui)
        run: bun run setup

      - name: Scenario suite, shard ${{ matrix.shard }} of 7 (regression gate)
        run: |
          cp tests/scenario-timings.json "$RUNNER_TEMP/scenario-timings.json"
          bun run test:scenarios --shard=${{ matrix.shard }}/7 --timings="$RUNNER_TEMP/scenario-timings.json" --update-timings

      - name: Upload the times this shard measured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/scenario-timings.json
          retention-days: 14

  # The deterministic evals (fakes: no VMs, no models): the primitives' recipes (correctness; their latency against
  # evals/primitives/baseline.json, a developer machine's, is printed but doesn't fail on a shared runner),
  # `capcomd run --recipe` against `--legacy` on the same goals, and the context eval's harness.
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPCOMD_NO_CONFIG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Primitives eval
        run: bun evals/primitives/run.ts --report-latency

      - name: Recipe parity eval
        run: bun evals/recipe-parity/run.ts

      # ADR-025 §12: the context eval's harness on the fake sandbox with its scripted agent (every runnable arm, every
      # task chain, the hidden checkers through `capcomd check`, the metrics); --expect fails on any verdict the fake
      # agent's policy doesn't produce. The live baselines per model are in docs/evidence/context/.
      - name: Context eval (fake sandbox and agent)
        run: bun scripts/eval-context.ts --seed 1 --expect --port 6571 --arms none,agents-md,index,index-paths,index-k1,index-k3,index-triggered

  # The single executable (scripts/build-binary.ts): built for Linux and driven like a user's install (install.sh,
  # no Bun on the PATH, fake agents), so a change that breaks the binary (a file read at run time, a dependency that
  # loads something by a computed name) fails here, not at release.
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install

      - name: Build capcomd-linux-x64
        run: bun scripts/build-binary.ts --target linux-x64 --outdir dist

      - name: Install it and drive it (scripts/release-smoke.sh)
        run: scripts/release-smoke.sh dist/capcomd-linux-x64 "$(bun -e 'console.log(require("./package.json").version)')"
