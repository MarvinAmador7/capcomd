name: menubar
on:
  pull_request:
    paths: ["apps/menubar/**", "openapi/**", ".github/workflows/menubar.yml"]
  push:
    branches: [main]
    paths: ["apps/menubar/**", "openapi/**"]
jobs:
  macos:
    runs-on: macos-15
    # One macOS runner serves every PR: a hung test must fail, not hold it for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: echo "BUN_BIN=$(which bun)" >> "$GITHUB_ENV"
      # Most of this job was compiling the Swift dependencies (NIO, the OpenAPI generator, …) from scratch. The build
      # folders are cached per runner image and resolved dependencies; SwiftPM rebuilds what changed since. A PR reads
      # main's cache; a change to Package.resolved or the image starts a new one (seeded from the closest match).
      - name: Swift build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/menubar/client/.build
            apps/menubar/app/.build
          key: menubar-swift-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('apps/menubar/app/Package.resolved', 'apps/menubar/client/Package.resolved') }}
          restore-keys: |
            menubar-swift-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-
      - name: Client tests
        timeout-minutes: 10
        working-directory: apps/menubar/client
        run: swift test
      - name: App build and tests (includes SwiftUI views)
        timeout-minutes: 15
        working-directory: apps/menubar/app
        run: swift build --build-tests && swift test --skip-build
