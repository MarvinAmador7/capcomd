<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ECEBEF; }
  .og { box-sizing: border-box; width: 1200px; height: 630px; padding: 48px 56px; display: grid; grid-template-rows: auto 1fr auto; }
  .og__mark { width: 190px; color: #140B22; }
  .og__mark svg { width: 100%; height: auto; }
  .og .sentence { padding: 0; font-size: 172px; align-self: center; }
  .og__line { margin: 0; font: 400 34px/1.2 "EB Garamond", Georgia, serif; color: #140B22; }
</style></head>
<body><div class="og">
  <span class="og__mark" data-wordmark></span>
  <h1 class="sentence"><span class="w">Put a</span> <span class="slot"><span class="floor"></span><span class="slot__crew" id="crew"></span></span> <span class="w">on it.</span></h1>
  <p class="og__line">Durable orchestration for swarms of coding agents.</p>
</div></body></html>
